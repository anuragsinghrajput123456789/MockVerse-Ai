services:
  # MockVerse(AI) Backend API service
  - type: web
    name: mockverse-ai-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
        placeholder: "mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/mockverse?retryWrites=true&w=majority"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
        placeholder: "Enter Google Gemini API Key"
      - key: CLIENT_URL
        sync: false
        placeholder: "https://your-mockverse-frontend.vercel.app"
      - key: FRONTEND_URL
        sync: false
        placeholder: "https://your-mockverse-frontend.vercel.app"
