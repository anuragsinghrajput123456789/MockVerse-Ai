services:
  # MockVerse(AI) Backend API service
  - type: web
    name: mockverse-ai-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
        placeholder: "mongodb+srv://user:pass@cluster.mongodb.net/mockverse"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
        placeholder: "Enter Google Gemini API Key"
      - key: FRONTEND_URL
        sync: false
        placeholder: "https://your-frontend-app.vercel.app"
